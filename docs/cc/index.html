<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты — UniView AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --bg-color: #f8fafc; --card-bg: #ffffff; --text-main: #0f172a; --text-muted: #64748b; --border: #e2e8f0; --radius: 12px; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
        header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 1rem 2rem; }
        .logo { font-weight: 700; font-size: 1.25rem; color: var(--primary); text-decoration: none; }
        .container { max-width: 800px; margin: 3rem auto; padding: 2.5rem; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); flex: 1; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        h1 { font-size: 2rem; margin-bottom: 1.5rem; }
        p { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 0.75rem; }
        .back-link { display: inline-block; margin-bottom: 1.5rem; color: var(--primary); text-decoration: none; font-weight: 500; font-size: 0.9rem; }
        footer { background: var(--card-bg); border-top: 1px solid var(--border); padding: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--text-muted); margin-top: auto; }
    </style>
</head>
<body>
    <header><a href="index.html" class="logo">UniView AI</a></header>
    <div class="container">
        <a href="index.html" class="back-link">← На главную</a>
        <h1>Контакты</h1>
        <p>Если у вас возникли вопросы, предложения или проблемы с аккаунтом, вы можете связаться с администрацией сервиса:</p>
        <p> <b>Email поддержки:</b> steppetech@mail.ru</p>
        <p> <b>Telegram:</b> @uniview_support</p>
    </div>
    <footer>© 2026 UniView AI. Все права защищены.</footer>
</body>
</html>
