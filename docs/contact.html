<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты — UniView AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --bg-color: #f8fafc; --card-bg: #ffffff; --text-main: #0f172a; --text-muted: #64748b; --border: #e2e8f0; --radius: 12px; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
        header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 1rem 2rem; }
        .logo { font-weight: 700; font-size: 1.25rem; color: var(--primary); text-decoration: none; }
        .container { max-width: 800px; margin: 3rem auto; padding: 2.5rem; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); flex: 1; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        h1 { font-size: 2rem; margin-bottom: 1.5rem; }
        p { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 0.75rem; }
        .back-link { display: inline-block; margin-bottom: 1.5rem; color: var(--primary); text-decoration: none; font-weight: 500; font-size: 0.9rem; }
        .back-link:hover { text-decoration: underline; }
        footer { background: var(--card-bg); border-top: 1px solid var(--border); padding: 2rem 1.5rem; margin-top: auto; }
        .footer-content { max-width: 500px; margin: 0 auto 1.5rem auto; display: flex; justify-content: space-between; }
        .footer-column { display: flex; flex-direction: column; gap: 0.8rem; }
        .footer-column.right { text-align: right; }
        footer a { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; }
        footer a:hover { color: var(--primary); }
        .footer-copyright { text-align: center; color: #94a3b8; font-size: 0.85rem; }
    </style>
</head>
<body>
    <header><a href="https://uniview.mansur.cfd" class="logo">UniView AI</a></header>
    <div class="container">
        <a href="https://uniview.mansur.cfd" class="back-link">← На главную</a>
        <h1>Контакты</h1>
        <p>По всем вопросам и предложениям вы можете связаться с администрацией проекта:</p>
        <p><b>Email:</b> support@uniview.mansur.cfd</p>
        <p><b>Сайт:</b> uniview.mansur.cfd</p>
    </div>
    <footer>
        <div class="footer-content">
            <div class="footer-column">
                <a href="about.html">Подробнее о нас</a>
                <a href="political.html">Политика Конфиденциальности</a>
                <a href="terms.html">Условия Пользования</a>
            </div>
            <div class="footer-column right">
                <a href="faq.html">FAQ</a>
                <a href="contact.html">Контакты</a>
            </div>
        </div>
        <div class="footer-copyright">
            © 2026 UniView AI. Все права защищены.
        </div>
    </footer>
</body>
</html>
